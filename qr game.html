function combos(a,k){let o=[];(function f(i,c){if(c.length===k){o.push(c);return}for(let j=i;j<a.length;j++)f(j+1,c.concat(a[j]))})(0,[]);return o}
function eval5(cs){let vs=cs.map(c=>c.v).sort((a,b)=>b-a),ct={};cs.forEach(c=>ct[c.v]=(ct[c.v]||0)+1);let g=Object.entries(ct).map(([v,n])=>({v:+v,n})).sort((a,b)=>b.n-a.n||b.v-a.v),fl=cs.every(c=>c.s===cs[0].s),u=[...new Set(vs)],st=u.length===5&&u[0]-u[4]===4?u[0]:u.join()==='14,5,4,3,2'?5:0;
 if(fl&&st)return[8,[st],'스트레이트 플러시'];if(g[0].n===4)return[7,[g[0].v,g[1].v],'포카드'];if(g[0].n===3&&g[1].n===2)return[6,[g[0].v,g[1].v],'풀하우스'];if(fl)return[5,vs,'플러시'];if(st)return[4,[st],'스트레이트'];
 if(g[0].n===3)return[3,[g[0].v,...g.slice(1).map(x=>x.v)],'트리플'];if(g[0].n===2&&g[1].n===2)return[2,[g[0].v,g[1].v,g[2].v],'투 페어'];if(g[0].n===2)return[1,[g[0].v,...g.slice(1).map(x=>x.v)],'원 페어'];return[0,vs,'하이 카드']}
function cmp(a,b){if(a[0]!==b[0])return a[0]-b[0];for(let i=0;i<5;i++)if((a[1][i]||0)!==(b[1][i]||0))return(a[1][i]||0)-(b[1][i]||0);return 0}
function evaluate(cs){let best=null;for(let c of combos(cs,5)){let e=eval5(c);if(!best||cmp(e,best)>0)best=e}return best}
let deck,board=[],bm=[],pot=0,cur=0,minR=20,btn=0,potChips=[],resolveNext,going=false;
const live=()=>P.filter(p=>!p.fold),nx=i=>(i+1)%6;
function upd(){$('pot').innerHTML=`<small>POT</small>${fmt(pot)}`;$('my').textContent='내 칩 '+fmt(P[0].stack);
 P.forEach(p=>{if(!p.lb)return;p.lb.querySelector('.st').textContent=fmt(p.stack)+' 칩';p.lb.querySelector('.ac').textContent=p.act||'';p.lb.classList.toggle('out',!!p.fold)});
 $('hand').textContent=P[0].cards&&P[0].cards.length&&board.length>=3?evaluate(P[0].cards.concat(board))[2]:''}
const msg=t=>$('msg').textContent=t;
function bubble(p,t){let b=p.lb.querySelector('.bb');b.textContent=t;b.classList.add('on');clearTimeout(p.bt);p.bt=setTimeout(()=>b.classList.remove('on'),1800)}
function say(p,k){let t=LN[k][Math.floor(R()*LN[k].length)];bubble(p,t);speak(t,p.st)}
function ranked(c){let a=c[0].v,b=c[1].v,hi=Math.max(a,b),lo=Math.min(a,b);return Math.min(1,a===b?.5+hi/28:hi/30+lo/50+(c[0].s===c[1].s?.06:0)+(hi>=12&&lo>=10?.12:0)+(hi-lo<=2?.03:0))}
function equity(p,n=110){let used=new Set(p.cards.concat(board).map(c=>c.r+c.s)),rest=newDeck().filter(c=>!used.has(c.r+c.s)),opp=Math.min(3,live().length-1),k=5-board.length,w=0;
 for(let s=0;s<n;s++){for(let i=rest.length-1;i>rest.length-14;i--){let j=Math.floor(R()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}
  let q=rest.slice(-13),bd=board.concat(q.slice(0,k)),me=evaluate(p.cards.concat(bd)),win=1;
  for(let o=0;o<opp;o++){let e=evaluate([q[k+o*2],q[k+o*2+1]].concat(bd)),c=cmp(e,me);if(c>0){win=0;break}if(c===0)win=.5}
  w+=win}return w/n}
/* GTO-inspired AI: position-based ranges, equity vs pot odds (MDF), balanced bluff ratio b/(1+2b); personality only shifts frequencies */
function decide(p){let st=p.st,call=Math.min(cur-p.bet,p.stack),can=p.stack+p.bet,pos=(p.i-btn+6)%6,tl=(st.tight-.5)*.2,ag=st.agg;
 const rz=f=>{let to=cur+Math.max(minR,Math.round(Math.max(pot,20)*f/10)*10);if(to>=can*.65)to=can;return{t:'raise',to:Math.min(to,can)}};
 if(board.length<3){let h=ranked(p.cards),thr=[.36,.40,.52,.50,.46,.42][pos]+tl; // BTN,SB,BB,UTG,HJ,CO
  if(cur<=20){if(call===0)return h>thr+.12&&R()<.5+ag*.4?{t:'raise',to:Math.min(can,60)}:{t:'check'};
   if(h>thr||(h>thr-.07&&R()<.25+ag*.2))return{t:'raise',to:Math.min(can,50+(pot>40?20:0))};return call<=10&&h>.3?{t:'call'}:{t:'fold'}}
  let od=call/(pot+call);if(h>.76&&can>cur&&R()<.85)return{t:'raise',to:Math.min(can,cur*3+10)};
  if(h>.45&&h<.62&&R()<.08+ag*.08&&cur<=70&&can>cur)return{t:'raise',to:Math.min(can,cur*3)}; // light 3-bet bluff
  if(h>thr+.1+od*.5-(pos===2?.08:0))return{t:'call'};return{t:'fold'}}
 let eq=equity(p),od=call/(pot+call||1);
 if(call===0){let big=eq>.68&&R()<.8,thin=eq>.42&&eq<=.68&&R()<.3+ag*.2,bl=eq>.12&&eq<.4&&R()<.12+ag*.14;
  if(big)return rz(eq>.85?1:.66);if(thin)return rz(.33);if(bl)return rz(.66);return{t:'check'}}
 if(eq>.82&&R()<.6&&can>cur)return rz(.8);
 if(eq>.2&&eq<.35&&R()<.05+ag*.06&&can>cur&&call<pot*.7)return rz(.7);
 if(eq>=od+.04+tl*.5||(od<.2&&R()<.1))return{t:'call'};return{t:'fold'}}
function humanAct(){return new Promise(res=>{let p=P[0],call=Math.min(cur-p.bet,p.stack),can=p.stack+p.bet,mt=Math.min(can,cur+minR),sl=$('sl');
 $('bot').classList.remove('off');$('ck').textContent=call?`콜 ${fmt(call)}`:'체크';sl.min=mt;sl.max=can;sl.step=10;sl.value=mt;$('rz').disabled=$('al').disabled=can<=cur;sl.disabled=mt>=can;
 const sv=()=>{$('sv').textContent=fmt(sl.value);$('rz').textContent='레이즈 '+fmt(sl.value)};sv();sl.oninput=sv;msg('당신의 차례입니다');
 const done=a=>{$('bot').classList.add('off');res(a)};
 $('fo').onclick=()=>done({t:'fold'});$('ck').onclick=()=>done({t:call?'call':'check'});$('rz').onclick=()=>done({t:'raise',to:Math.min(can,+sl.value)});$('al').onclick=()=>done({t:'raise',to:can})})}
async function aiAct(p){msg(p.name+' 고민 중…');mood(p,'t');let r=Math.random();
 if(r<.5){headTo(p,.3,.12);await poseR(p.g,CHIN,.4)}else{await Promise.all([headTo(p,.2),poseR(p.g,LOOK,.35)]);let c=p.cm[0];tw(.3,k=>c.rotation.x=PI-Math.sin(k*PI)*.9)}
 await sleep(500+R()*700);mood(p,'n');headTo(p,0);poseR(p.g,IDLE,.3);return decide(p)}
async function chips(from,to,n,thr){let arr=[];for(let k=0;k<n;k++){let c=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.045,18),M([0xb23c35,0xc9c5b8,0xc79b4d][k%3],.35,.2));c.position.copy(from);scene.add(c);arr.push(c);potChips.push(c)}
 sfx.chip();await Promise.all(arr.map((c,k)=>sleep(k*55).then(()=>{let e=new THREE.Vector3(to.x+(R()-.5)*1.1,YT+R()*.05,to.z+(R()-.5)*.6);return Promise.all([fly(c,e,thr?.32:.6,thr?.25:.8),tw(thr?.32:.6,q=>{c.rotation.x=thr?q*PI*3:0})])})));sfx.chip()}
async function muck(p){let cs=p.i?p.cm:P[0].cm,to=p.i?sp(p.th,.4).setY(YT):new THREE.Vector3(0,YT,1.6);if(!p.i)await hMove(new THREE.Vector3(0,1.7,2.3));
 await Promise.all(cs.map((c,k)=>{flip(c,false);return fly(c,to.clone().add(new THREE.Vector3(k*.1,0,0)),.5,.3)}));await Promise.all(cs.map(c=>tw(.3,k=>c.scale.setScalar(1-k))));cs.forEach(c=>scene.remove(c));if(!p.i)hMove(REST)}
async function show(p,k,add){let who=!p.i;p.act={fold:'폴드',check:'체크',call:'콜 '+fmt(add),raise:'레이즈 '+fmt(p.bet),allin:'올인 '+fmt(add)}[k];msg((p.name)+': '+p.act);
 if(!who)say(p,k);
 if(k==='fold')await muck(p);
 else if(k==='check'){if(who){await hMove(new THREE.Vector3(REST.x,1.9,REST.z),.15);await hMove(REST,.12)}else await poseR(p.g,[-1.1,-.7],.15);sfx.knock();if(!who)poseR(p.g,IDLE,.2)}
 else{let thr=k!=='call';if(who){await hMove(S);await hMove(new THREE.Vector3(S.x,1.8,S.z),.2)}else await poseR(p.g,thr?PUSH:[-1.1,-.4],.25);
  await chips(who?rh.position:p.chipP,POT,k==='call'?3:6,thr);if(who)hMove(REST);else poseR(p.g,IDLE,.3)}
 upd()}
async function perform(p,a){let add=0;
 if(a.t==='fold')p.fold=true;
 else if(a.t!=='check'){let to=a.t==='raise'?Math.min(a.to,p.stack+p.bet):Math.min(cur,p.stack+p.bet);if(a.t==='raise'&&to<=cur){a.t='call';to=Math.min(cur,p.stack+p.bet)}add=to-p.bet;if(a.t==='raise'){minR=Math.max(minR,to-cur);cur=to}}
 p.stack-=add;p.bet+=add;p.tot+=add;pot+=add;if(add>0&&p.stack===0)p.allin=true;
 await show(p,a.t==='raise'&&p.allin?'allin':a.t,add);return a.t==='raise'}
async function round(first,pre){if(!pre){P.forEach(p=>p.bet=0);cur=0;minR=20;P.forEach(p=>p.act=p.fold?'폴드':'')}
 let pend=new Set(P.filter(p=>!p.fold&&!p.allin).map(p=>p.i)),i=first;
 while(pend.size){if(live().length<2)return;let can=P.filter(p=>!p.fold&&!p.allin);if(can.length<2&&can.every(p=>p.bet>=cur))return;
  if(!pend.has(i)){i=nx(i);continue}let p=P[i];p.act='';p.lb&&p.lb.classList.remove('out');
  let a=i?await aiAct(p):await humanAct();pend.delete(i);
  if(await perform(p,a))pend=new Set(P.filter(q=>!q.fold&&!q.allin&&q.i!==i).map(q=>q.i));i=nx(i)}}
/* dealing */
async function dealCard(c,pos,ry,up){let m=mkCard(c,new THREE.Vector3(0,2,-3.3));if(!ry)m.scale.setScalar(1.6);sfx.card();pose(dealer,PUSH,IDLE,.12).then(()=>pose(dealer,IDLE,IDLE,.25));await fly(m,pos,.35,.7,ry);if(up)flip(m,true);return m}
function slot(p,k){if(!p.i)return new THREE.Vector3(-.5+k*1,YT+.02,2.4);let b=sp(p.th,.62).setY(YT);return b.add(new THREE.Vector3(Math.cos(p.ry)*(k?.25:-.25),0,-Math.sin(p.ry)*(k?.25:-.25)))}
function clearTable(){[].concat(bm,...P.map(p=>p.cm||[])).forEach(m=>scene.remove(m));potChips.forEach(c=>scene.remove(c));bm=[];potChips=[];board=[]}
async function street(n){for(let k=0;k<n;k++){let c=deck.pop(),m=await dealCard(c,new THREE.Vector3((board.length-2)*.85,YT+.02,-.3),0);board.push(c);bm.push(m)}}
function awardPots(){let lv=[...new Set(P.filter(p=>p.tot>0).map(p=>p.tot))].sort((a,b)=>a-b),prev=0,out=[];
 live().forEach(p=>p.ev=live().length>1?evaluate(p.cards.concat(board)):[0,[0],'']);
 for(let L of lv){let amt=0;P.forEach(p=>amt+=Math.max(0,Math.min(p.tot,L)-prev));prev=L;let el=P.filter(p=>!p.fold&&p.tot>=L);if(!el.length)el=live();
  let best=el.reduce((b,p)=>cmp(p.ev,b)>0?p.ev:b,el[0].ev),w=el.filter(p=>cmp(p.ev,best)===0),sh=Math.floor(amt/w.length);w.forEach((p,k)=>{p.stack+=sh+(k?0:amt-sh*w.length);out.push([p,sh,L===lv[0]?'메인 팟':'사이드 팟',p.ev[2]])})}
 return out}
async function play(){clearTable();hn.textContent='HAND #'+(++window.hnum);
 P.forEach(p=>{if(p.stack<=0){p.stack=2000;if(!p.i)msg('칩을 재충전했습니다')}p.bet=p.tot=0;p.fold=p.allin=false;p.act='';p.cards=[];p.cm=[];if(p.g){mood(p,'n');pose(p.g,IDLE,IDLE)}});
 deck=newDeck();pot=0;btn=nx(btn);puck.position.set(...[sp(P[btn].th,.7).x+.4,YT,sp(P[btn].th,.7).z]);upd();
 let sb=nx(btn),bb=nx(sb);cur=20;minR=20;for(let [i,n] of [[sb,10],[bb,20]]){let p=P[i],a=Math.min(n,p.stack);p.stack-=a;p.bet=p.tot=a;pot+=a;p.act=(i===sb?'SB ':'BB ')+a;if(a===p.stack+a&&!p.stack)p.allin=true;if(!i)chips(S,POT,2,false);}upd();
 msg('딜러가 카드를 나눠줍니다');
 for(let r=0;r<2;r++)for(let k=0;k<6;k++){let p=P[(sb+k)%6],c=deck.pop();p.cards.push(c);p.cm.push(await dealCard(c,slot(p,r),p.i?p.ry:0,false));if(!p.i)await sleep(60)}
 for(let c of P[0].cm)flip(c,true);upd();
 P.filter(p=>p.i).forEach((p,k)=>sleep(k*250).then(async()=>{await Promise.all([headTo(p,.3),poseR(p.g,LOOK,.3)]);poseR(p.g,IDLE,.4);headTo(p,0)}));await sleep(900);
 await round(nx(bb),true);
 for(let n of [3,1,1]){if(live().length<2)break;msg(n===3?'플랍':board.length===3?'턴':'리버');await street(n);for(let m of bm.slice(-n)){flip(m,true);await sleep(150)}upd();if(P.filter(p=>!p.fold&&!p.allin).length>1)await round(nx(btn));await sleep(300)}
 let L=live();if(L.length>1){msg('쇼다운');for(let p of L.filter(p=>p.i)){p.cm.forEach(c=>{c.position.y=YT;c.scale.setScalar(1.5);flip(c,true)});await sleep(500)}}
 let res=awardPots(),w=[...new Set(res.map(r=>r[0]))],tot=pot;
 upd();let wp=w[0].i?w[0].chipP:S;await Promise.all(potChips.map(c=>fly(c,wp.clone().setY(YT),.8,.8)));potChips.forEach(c=>scene.remove(c));potChips=[];pot=0;
 P.forEach(p=>{if(!p.g)return;if(w.includes(p)){mood(p,'h');pose(p.g,UP,UP,.4);setTimeout(()=>say(p,'win'),200)}else if(!p.fold){mood(p,'s');pose(p.g,DOWN,DOWN,.4);headTo(p,.35)}});
 let human=w.includes(P[0]);human?sfx.win():sfx.lose();
 if(!human&&L.includes(P[0])||!human)setTimeout(()=>{let l=L.filter(p=>p.i&&!w.includes(p))[0];l&&say(l,'lose')},1500);
 upd();await sleep(1200);
 $('rt').textContent=human?'YOU WIN!':w.map(p=>p.name).join(', ')+' 승리';
 $('rp').innerHTML=res.map(r=>`${r[0].name} · ${r[2]} ${fmt(r[1])}칩${r[3]?' · '+r[3]:''}`).join('<br>')+`<br><br>총 팟 ${fmt(tot)}`;
 $('rs').classList.remove('hide');await new Promise(r=>$('rn').onclick=r);$('rs').classList.add('hide')}
window.hnum=0;const hn=$('hn');
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊';if(mute&&window.speechSynthesis)speechSynthesis.cancel()};
